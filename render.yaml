services:
  - type: web
    name: car-rental
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: car_rental
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PAYU_MODE
        value: test
